<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Breadboard pinhole pattern -->
    <pattern id="breadboardHoles" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="4" height="4" rx="1" fill="#D5CFC2"/>
      <circle cx="8" cy="8" r="1.2" fill="#535C51" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#20251F"/>
  
  <!-- Outer Frame -->
  <rect x="20" y="20" width="760" height="460" fill="#282F27" stroke="#374135" stroke-width="1.5"/>

  <!-- Top Title / Spec Header -->
  <text x="40" y="55" fill="#F2EFE6" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.5">FIG. 02 // SAFEGUARD PROTOTYPE BENCH LAYOUT</text>
  <text x="760" y="55" text-anchor="end" fill="#D44B32" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1">BREADBOARD VIEW</text>
  <line x1="40" y1="70" x2="760" y2="70" stroke="#374135" stroke-width="1"/>

  <!-- Solderless Breadboard Base -->
  <g transform="translate(60, 95)">
    <!-- Main white plastic body -->
    <rect x="0" y="0" width="680" height="340" rx="6" fill="#EDE9DF" stroke="#20251F" stroke-width="2"/>
    
    <!-- Red power rail top -->
    <line x1="20" y1="20" x2="660" y2="20" stroke="#D44B32" stroke-width="2"/>
    <text x="10" y="23" fill="#D44B32" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="bold">+</text>
    
    <!-- Blue power rail top -->
    <line x1="20" y1="36" x2="660" y2="36" stroke="#315BEA" stroke-width="2"/>
    <text x="10" y="39" fill="#315BEA" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="bold">-</text>

    <!-- Tie point holes grid -->
    <rect x="20" y="55" width="640" height="100" fill="url(#breadboardHoles)"/>
    
    <!-- Center divider channel -->
    <rect x="20" y="160" width="640" height="15" fill="#DDD7CB"/>
    
    <!-- Bottom tie point holes grid -->
    <rect x="20" y="180" width="640" height="100" fill="url(#breadboardHoles)"/>

    <!-- Bottom power rails -->
    <line x1="20" y1="300" x2="660" y2="300" stroke="#315BEA" stroke-width="2"/>
    <line x1="20" y1="316" x2="660" y2="316" stroke="#D44B32" stroke-width="2"/>

    <!-- 1. ESP32 DevKit Component (Straddling center channel) -->
    <g transform="translate(60, 70)">
      <!-- Black PCB -->
      <rect x="0" y="0" width="180" height="195" rx="3" fill="#1C211B" stroke="#B8C5A8" stroke-width="1.2"/>
      <!-- Metal RF Shield -->
      <rect x="20" y="20" width="140" height="100" fill="#424D3F" stroke="#B8C5A8" stroke-width="0.8" rx="2"/>
      <text x="90" y="60" text-anchor="middle" fill="#F2EFE6" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="bold">ESP32-WROOM-32</text>
      <text x="90" y="80" text-anchor="middle" fill="#D44B32" font-family="'IBM Plex Mono', monospace" font-size="8">Wi-Fi + BLE MCU</text>
      
      <!-- Micro-USB Jack -->
      <rect x="65" y="185" width="50" height="18" rx="2" fill="#8E998B"/>
      <rect x="75" y="195" width="30" height="8" fill="#535C51"/>

      <!-- EN and BOOT tactile switches on MCU -->
      <rect x="15" y="150" width="22" height="16" fill="#D5CFC2" stroke="#20251F"/>
      <circle cx="26" cy="158" r="4" fill="#20251F"/>
      <text x="26" y="178" text-anchor="middle" fill="#B8C5A8" font-family="'IBM Plex Mono', monospace" font-size="7">EN</text>

      <rect x="143" y="150" width="22" height="16" fill="#D5CFC2" stroke="#20251F"/>
      <circle cx="154" cy="158" r="4" fill="#20251F"/>
      <text x="154" y="178" text-anchor="middle" fill="#B8C5A8" font-family="'IBM Plex Mono', monospace" font-size="7">BOOT</text>

      <!-- Pin headers on left and right -->
      <g fill="#B8C5A8">
        <rect x="-8" y="15" width="8" height="165" fill="#2D352B"/>
        <rect x="180" y="15" width="8" height="165" fill="#2D352B"/>
      </g>
    </g>

    <!-- 2. EMERGENCY PUSH BUTTON (Prominent Red Cap) -->
    <g transform="translate(300, 110)">
      <rect x="0" y="0" width="70" height="70" rx="4" fill="#FBF9F5" stroke="#20251F" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="26" fill="#D44B32" stroke="#9E2F1B" stroke-width="2"/>
      <circle cx="35" cy="35" r="18" fill="#B33822"/>
      <text x="35" y="38" text-anchor="middle" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="bold">EMERGENCY</text>
      <text x="35" y="90" text-anchor="middle" fill="#20251F" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600">SW1 / GPIO18</text>
    </g>

    <!-- 3. RESET PUSH BUTTON (Neutral Muted Cap) -->
    <g transform="translate(300, 210)">
      <rect x="0" y="0" width="70" height="70" rx="4" fill="#FBF9F5" stroke="#20251F" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="22" fill="#B8C5A8" stroke="#535C51" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="14" fill="#7C9862"/>
      <text x="35" y="38" text-anchor="middle" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="bold">RESET</text>
      <text x="35" y="90" text-anchor="middle" fill="#20251F" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600">SW2 / GPIO19</text>
    </g>

    <!-- 4. ACTIVE BUZZER MODULE -->
    <g transform="translate(420, 120)">
      <circle cx="40" cy="40" r="36" fill="#1C211B" stroke="#20251F" stroke-width="2"/>
      <circle cx="40" cy="40" r="10" fill="#535C51"/>
      <circle cx="40" cy="40" r="4" fill="#1C211B"/>
      <text x="40" y="90" text-anchor="middle" fill="#20251F" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600">3.3V PIEZO (GPIO23)</text>
    </g>

    <!-- 5. RED ALERT LED & GREEN READY LED -->
    <g transform="translate(540, 110)">
      <!-- Red LED -->
      <circle cx="35" cy="35" r="18" fill="#D44B32" stroke="#B33822" stroke-width="1.5"/>
      <circle cx="30" cy="28" r="5" fill="#FFA594" opacity="0.8"/>
      <text x="35" y="70" text-anchor="middle" fill="#D44B32" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="bold">RED (ALERT)</text>
      <text x="35" y="82" text-anchor="middle" fill="#535C51" font-family="'IBM Plex Mono', monospace" font-size="7.5">330Ω to GPIO22</text>
    </g>

    <g transform="translate(540, 210)">
      <!-- Green LED -->
      <circle cx="35" cy="35" r="18" fill="#7C9862" stroke="#526E3B" stroke-width="1.5"/>
      <circle cx="30" cy="28" r="5" fill="#CEE5B7" opacity="0.8"/>
      <text x="35" y="70" text-anchor="middle" fill="#526E3B" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="bold">GREEN (NORMAL)</text>
      <text x="35" y="82" text-anchor="middle" fill="#535C51" font-family="'IBM Plex Mono', monospace" font-size="7.5">330Ω to GPIO21</text>
    </g>

    <!-- Jumper Wires (Curved organic arcs) -->
    <!-- Red Wire: GPIO22 to Red LED -->
    <path d="M 248 100 Q 380 40 540 120" fill="none" stroke="#D44B32" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Yellow Wire: GPIO23 to Buzzer -->
    <path d="M 248 120 Q 340 70 430 130" fill="none" stroke="#D4A732" stroke-width="2" stroke-linecap="round"/>
    <!-- Green Wire: GPIO21 to Green LED -->
    <path d="M 248 140 Q 400 280 540 230" fill="none" stroke="#7C9862" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Orange Wire: Emergency Switch to GPIO18 -->
    <path d="M 310 130 Q 280 140 248 180" fill="none" stroke="#D44B32" stroke-width="2" stroke-linecap="round"/>
    <!-- Black Wire: Ground rail connections -->
    <path d="M 248 200 Q 200 320 180 336" fill="none" stroke="#20251F" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
